name: Verify engineering calculations
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  calculations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reference invariants
        run: python skills/torres-resfriamento-industriais/scripts/calcular.py --self-test
      - name: Numerical and report checks
        run: python -m unittest discover -s tests -v
      - name: Reproduce example
        run: python skills/torres-resfriamento-industriais/scripts/calcular.py --out output
      - uses: actions/upload-artifact@v4
        with:
          name: cooling-tower-example-python-${{ matrix.python-version }}
          path: output/
